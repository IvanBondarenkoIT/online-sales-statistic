<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 20px; }
    label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      background: #243044;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .error { color: var(--err); font-size: 0.875rem; margin-bottom: 12px; }
    input[name="next"] { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Вход</h1>
    <p id="err" class="error" aria-live="polite"></p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="" id="next" />
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" required autocomplete="username" />
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
      <button type="submit">Войти</button>
    </form>
  </div>
  <script>
    var p = new URLSearchParams(location.search);
    if (p.get('error') === '1') document.getElementById('err').textContent = 'Неверный логин или пароль.';
    document.getElementById('next').value = p.get('next') || '';
  </script>
</body>
</html>
